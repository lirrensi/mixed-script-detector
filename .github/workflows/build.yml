name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -v -o mixed-script-detector

      - name: Verify binary exists
        run: ls -la mixed-script-detector

      - name: Run go vet
        run: go vet ./...

      - name: Run tests (if any)
        run: go test -v ./... || echo "No tests found"
