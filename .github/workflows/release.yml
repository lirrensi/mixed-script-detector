name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            suffix: ""
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            suffix: ""
          - os: macos-latest
            goos: darwin
            goarch: amd64
            suffix: ""
          - os: macos-latest
            goos: darwin
            goarch: arm64
            suffix: ""
          - os: windows-latest
            goos: windows
            goarch: amd64
            suffix: .exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -o mixed-script-detector${{ matrix.suffix }} -v

      - name: Create archive
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            cp mixed-script-detector.exe dist/
            cd dist && zip -r ../mixed-script-detector-${{ matrix.goos }}-${{ matrix.goarch }}.zip mixed-script-detector.exe
          else
            cp mixed-script-detector dist/
            cd dist && tar -czf ../mixed-script-detector-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz mixed-script-detector
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mixed-script-detector-${{ matrix.goos }}-${{ matrix.goarch }}
          path: mixed-script-detector-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.zip' || '.tar.gz' }}
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create release assets
        run: |
          cd artifacts
          for f in */*; do
            mv "$f" ./
          done
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
